# ──────────────────────────────────────────────────────────────────────────
# tv.example.com: Nginx Proxy Manager "Advanced" configuration for a
# Broadcast Box that only Mattermost serves to viewers.
#
# Nothing here serves viewers. Matty Plugin reaches Broadcast Box directly
# over the LAN (its Broadcast Box URL, here http://192.168.1.20:8080) and
# never touches this host, so the only thing left public is publishing, which
# streaming software such as OBS cannot do any other way from outside.
#
# No auth_basic anywhere: there is nothing left behind it to protect.
#
# Assumes Broadcast Box runs with DISABLE_FRONTEND=TRUE, so its web pages and
# their catch-all do not exist at the origin either, and with
# STREAM_PROFILE_POLICY=RESERVED, so only reserved profiles may publish, and
# only with their token.
#
# Replace tv.example.com (the proxy host this is pasted into) and
# 192.168.1.20:8080 (Broadcast Box's LAN address) with your own.
# ──────────────────────────────────────────────────────────────────────────

client_max_body_size 1m;

# ── Publishing: the only publicly reachable endpoint ──────────────────────
location ^~ /api/whip {
    limit_except POST PATCH DELETE OPTIONS { deny all; }

    proxy_pass http://192.168.1.20:8080;
    proxy_hide_header Link;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Profile editing is done by the plugin over the LAN. The exact match beats the
# ^~ prefix above, so this stays denied even though it sits under /api/whip.
location = /api/whip/profile {
    deny all;
}

# Redundant while the catch-all returns 404, but explicit: the admin API is
# still registered in Broadcast Box v2.0.2 and is not gated by
# DISABLE_FRONTEND.
location ^~ /api/admin {
    deny all;
}

# ── Everything else ───────────────────────────────────────────────────────
# A regex, so it takes precedence over the catch-all Nginx Proxy Manager
# generates without declaring a duplicate `location /`. 404 rather than 403:
# there is no reason to confirm which paths exist.
location ~ ^/ {
    return 404;
}
