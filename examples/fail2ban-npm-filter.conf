# A fail2ban filter for Nginx Proxy Manager's access logs, for example
# /etc/fail2ban/filter.d/npm.conf.
#
# What matters for Matty Plugin is the third ignoreregex line.
#
# The first two exempt Mattermost's own API (/api/v4/) and its assets
# (/static/), so a signed-in person is never banned for the app's normal
# traffic. Plugin endpoints live under /plugins/<plugin id>/ and are not
# covered by those, so without the third line a 4xx from a plugin counts as a
# brute-force attempt. Mattermost answers 404 for every route of a plugin
# while it is stopped, restarting or crashed, and a plugin answers 403 to a
# wrong bearer token, which would turn any plugin's background requests, or
# one mistyped token, into a ban for the person reading.

[Definition]
failregex = \] - (400|401|403|404|405|444) \d+ - .*\[Client <HOST>\]
            \] (400|401|403|404|405|444) - .*\[Client <HOST>\]
ignoreregex = /api/v4/.*\[Client <HOST>\]
              /static/.*\[Client <HOST>\]
              /plugins/.*\[Client <HOST>\]
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
